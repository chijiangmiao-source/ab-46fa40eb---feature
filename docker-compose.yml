services:
  inverter:
    build: .
    image: oligomer-inverter:latest
    # Host-side published port is configurable through the API_HOST_PORT
    # environment variable (defaults to 8080).  The in-container listen port
    # can be changed independently through API_PORT.
    ports:
      - "${API_HOST_PORT:-8080}:${API_PORT:-8080}"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-8080}"
      SOLVER_NODE_BUDGET: "${SOLVER_NODE_BUDGET:-5000000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request as u; port=os.environ.get('API_PORT','8080'); r=u.urlopen('http://127.0.0.1:'+port+'/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 5
    restart: unless-stopped
